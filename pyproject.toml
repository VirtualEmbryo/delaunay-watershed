[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

# The repository builds three distributions, all at one version (the release scripts check it):
# * "delaunay-watershed-3d", from this file: the package `dw3d` (3-D masks);
# * "delaunay-watershed-2d", from distributions/delaunay-watershed-2d: the package `dw2d` (2-D masks);
# * "delaunay-watershed", from distributions/delaunay-watershed: a metapackage without code that requires both.
# Each package stays in the distribution that has always installed it, so that no file changes owner on an upgrade.
[project]
name = "delaunay-watershed-3d"
version = "0.8.0rc1"
description = "Geometrical reconstruction of cell assemblies from 3-D instance segmentations (package dw3d)"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["License"]
authors = [{ name = "Turlier lab", email = "virtualembryo@gmail.com" }]
maintainers = [{ name = "Matthieu Perez", email = "matthieu.perez@cnrs.fr" }]
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Intended Audience :: Science/Research",
]
# dw3d's run-time imports (iorec reads and writes the .rec format), and delaunay-watershed-2d at the same version, so
# that installing dw3d installs dw2d too (it adds no third-party package; each package keeps its own distribution).
# Polyscope, for dw3d's viewer, is in the `viewing` extra. Python 3.12 or later: iorec 1.4.1 requires it, and the CI
# tests 3.12 to 3.14.
dependencies = [
  "delaunay-watershed-2d==0.8.0rc1",
  "edt>=2.4.1",
  "iorec>=1.4.1",
  "meshio>=5.3.5",
  "networkx>=2.8.0",
  "numpy>=2.0.0",
  "scikit-image>=0.23.1",
  "scipy>=1.13.0",
]

[project.urls]
Homepage = "https://github.com/VirtualEmbryo/delaunay-watershed"
"Team website" = "https://www.turlierlab.com/"

[project.optional-dependencies]
# dw3d's Polyscope viewer (matplotlib, as in 0.7.1 and earlier, for the figures of the examples).
viewing = ["polyscope>=2.5.0", "matplotlib>=3.8.4"]
# For the figure scripts only (dw3d_benchmarks/mesh_quality_comparison/figures/), so plotting
# a benchmark does not require the Polyscope viewer (`viewing`). These scripts also import
# foambryo, which this extra does not install: `pip install foambryo`. `src/dw3d` itself must never depend on foambryo -- only the benchmarks package
# does.
benchmarks = ["matplotlib>=3.8.4"]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["dw3d*"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "ty", "pytest-cov>=4.0.0"]

[tool.uv]
compile-bytecode = true

[tool.pytest.ini_options]
# A bare `pytest` from the repo root must collect only the production suite. `testpaths` keeps
# it from collecting test files outside `tests/`, such as development scripts kept in the
# development repository, which would inflate the test count and let them break the suite.
addopts = ["-ra", "--showlocals"]
testpaths = ["tests"]

[tool.ruff]
# Enable the pycodestyle (`E`) and Pyflakes (`F`) rules by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
lint.select = [
  "E",
  "F",
  "W",
  "C90",
  "I",
  "N",
  "D",
  "UP",
  "ANN",
  "S",
  "B",
  "A",
  "COM",
  # "CPY",
  "C4",
  "EM",
  "EXE",
  "FA",
  "ISC",
  # "INP",
  "PT",
  "Q",
  "SIM",
  "ARG",
  "PTH",
  "NPY",
  "PERF",
  "RUF",
]
lint.ignore = ["S101", "ANN10"]

# Allow fix for all enabled rules (when `--fix`) is provided.
lint.fixable = ["ALL"]
lint.unfixable = []

# Exclude a variety of commonly ignored directories.
exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".git-rewrite",
  ".hg",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".pytype",
  ".ruff_cache",
  ".ty_cache",
  ".svn",
  ".tox",
  ".venv",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
  "venv",
  "*.pyi",
]
line-length = 120

target-version = "py312"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test functions are not a public API: they are collected and called by pytest, never
# imported by a caller who needs a signature or a docstring. Their names are the
# documentation (`test_score_gap_fraction_below_1e3`), and their arguments are fixtures
# injected by pytest rather than parameters a caller chooses. Annotating and
# docstringing all of them would add ~60 lines of noise without adding information, so
# these four API-documentation rules are disabled here and *only* here. Everything else
# in the configured rule set — including every correctness and simplification rule —
# still applies to tests.
"tests/**" = ["ANN001", "ANN201", "ANN202", "D103", "D104"]

[tool.ty.environment]
python-version = "3.12"
root = ["./src"]

[tool.check-manifest]
ignore = [
  ".github/**",
  "Justfile",
  "Examples/**",
  "data/**",
  "Figures_readme/**",
]

[tool.coverage.run]
omit = []

[tool.coverage.report]
skip_empty = true
